<style>
/* CSS Reset and Variables */

  --primary-hover: #D97706;
  --primary-light: #FEF3C7;
  --navy: #1E293B; /* Slate 800 */
  --navy-dark: #0F172A; /* Slate 900 */
  --success: #10B981;
  --success-light: #D1FAE5;
  --danger: #EF4444;
  --danger-light: #FEE2E2;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --text: #334155; /* Slate 700 */
  --text-muted: #64748B; /* Slate 500 */
  --border: #E2E8F0;
  --radius-sm: 8px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

/* Typography */
h1, h2, h3, h4 { color: var(--navy-dark); font-weight: 700; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.25rem; }
.muted { color: var(--text-muted); }
.small { font-size: 0.875rem; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: var(--radius-sm);
  padding: 10px 16px; font-weight: 600;
  transition: all 0.2s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-dark { background: var(--navy-dark); color: white; }
.btn-dark:hover { background: var(--navy); transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--bg); border-color: var(--text-muted); }

/* Layout */
.app { min-height: 100vh; }
.topbar {
  height: 70px; background: rgba(255,255,255,0.8); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem; color: var(--navy-dark); }
.brand i { font-size: 1.5rem; color: var(--primary); }
.top-actions { display: flex; gap: 12px; align-items: center; }

/* Hero / Landing */
.hero {
  min-height: calc(100vh - 70px); display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 24px; text-align: center;
  background: radial-gradient(circle at top right, rgba(245,158,11,0.1), transparent 40%),
              radial-gradient(circle at bottom left, rgba(16,185,129,0.05), transparent 40%);
}
.hero-logo {
  width: 80px; height: 80px; border-radius: 20px; background: var(--navy-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; color: var(--primary); box-shadow: var(--shadow-lg); margin: 0 auto 24px;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; background: var(--primary-light);
  color: var(--primary-hover); padding: 6px 12px; border-radius: 99px; font-size: 0.875rem; font-weight: 600; margin-bottom: 24px;
}
.hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); line-height: 1.1; margin-bottom: 16px; }
.hero h1 span { color: var(--primary); }
.hero p { font-size: 1.125rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 40px; }

.role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; width: 100%; max-width: 900px; text-align: left; }
.role-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 32px; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s;
  display: flex; flex-direction: column;
}
.role-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
.role-icon {
  width: 56px; height: 56px; border-radius: var(--radius); background: var(--primary-light);
  display: flex; align-items: center; justify-content: center; font-size: 1.75rem; color: var(--primary-hover); margin-bottom: 20px;
}
.role-card h2 { margin-bottom: 12px; }
.role-card p { margin-bottom: 24px; flex-grow: 1; }
.role-card .btn { width: 100%; }

/* Forms & Auth */
.auth-wrap { min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.auth-card { width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); }
.auth-head { display: flex; gap: 16px; align-items: center; margin-bottom: 32px; }
.auth-head .icon { width: 56px; height: 56px; border-radius: var(--radius); background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; color: var(--primary-hover); }
.auth-options { display: flex; flex-direction: column; gap: 12px; }

.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.875rem; font-weight: 600; color: var(--navy-dark); }
.field input, .field select {
  padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); transition: all 0.2s;
}
.field input:focus, .field select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Dashboard Shell */
.shell { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 70px); }
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border); padding: 24px 16px;
  position: sticky; top: 70px; height: calc(100vh - 70px); display: flex; flex-direction: column;
}
.side-title { padding: 0 12px 24px; color: var(--navy-dark); font-weight: 700; font-size: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.side-title small { display: block; color: var(--text-muted); font-weight: 500; margin-top: 4px; font-size: 0.8125rem; }
.nav { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
.nav button {
  display: flex; align-items: center; gap: 12px;
  border: none; background: transparent; color: var(--text); padding: 12px;
  border-radius: var(--radius-sm); font-weight: 600; transition: all 0.2s; text-align: left;
}
.nav button i { font-size: 1.25rem; color: var(--text-muted); }
.nav button:hover { background: var(--bg); color: var(--navy-dark); }
.nav button:hover i { color: var(--primary); }
.nav button.active { background: var(--primary-light); color: var(--primary-hover); }
.nav button.active i { color: var(--primary-hover); }
.side-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }

.main { padding: 32px; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 32px; }
.page-head h1 { margin-bottom: 4px; }

/* Cards & Stats */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-bottom: 24px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); }
.stat .label { color: var(--text-muted); font-size: 0.875rem; font-weight: 600; }
.stat .value { font-size: 2rem; font-weight: 800; color: var(--navy-dark); margin: 8px 0; }
.stat .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 0.875rem; color: var(--success); font-weight: 600; background: var(--success-light); padding: 2px 8px; border-radius: 99px; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
.two { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

/* Tables */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; }
.table th, .table td { padding: 16px; border-bottom: 1px solid var(--border); text-align: left; }
.table th { font-size: 0.8125rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; background: var(--bg); }
.table th:first-child { border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm); }
.table th:last-child { border-top-right-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.available { background: var(--success-light); color: #065F46; }
.reserved { background: #DBEAFE; color: #1E3A8A; }
.donated { background: #F3E8FF; color: #6B21A8; }
.collected { background: var(--success-light); color: #065F46; }
.cancelled { background: var(--danger-light); color: #991B1B; }

/* Food Cards */
.food-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.food-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
.food-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.food-visual { height: 160px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 5rem; position: relative; }
.food-visual .badge { position: absolute; top: 12px; right: 12px; z-index:2; }
.food-visual img { width:100%; height:100%; object-fit:cover; display:block; }
.food-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
.food-body h3 { margin-bottom: 8px; }
.price { display: flex; align-items: baseline; gap: 8px; margin: 12px 0; }
.price strong { font-size: 1.5rem; color: var(--navy-dark); }
.old { text-decoration: line-through; color: var(--text-muted); font-size: 0.875rem; }
.off { color: var(--success); font-size: 0.875rem; font-weight: 700; background: var(--success-light); padding: 2px 6px; border-radius: 4px; }
.food-meta { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.875rem; margin-bottom: 20px; padding-top: 12px; border-top: 1px solid var(--border); }
.food-body .btn { margin-top: auto; }

/* Notices & Banners */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: var(--radius-sm); background: #FFFBEB; border: 1px solid #FEF3C7; color: #92400E; margin-bottom: 24px; font-size: 0.875rem; line-height: 1.5; }
.notice i { font-size: 1.25rem; color: var(--primary); flex-shrink: 0; }
.demo-banner { background: linear-gradient(135deg, var(--navy-dark), var(--navy)); color: white; border-radius: var(--radius); padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 32px; box-shadow: var(--shadow); }
.demo-banner b { color: var(--primary); display: flex; align-items: center; gap: 8px; }

/* Mobile Nav */
.mobile-nav { display: none; }

/* Modals & Toasts */
.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.2s ease; }
.modal.show { opacity: 1; visibility: visible; }
.modal-card { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 480px; padding: 32px; box-shadow: var(--shadow-lg); transform: translateY(20px) scale(0.95); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-height: 90vh; overflow-y: auto; position: relative; }
.modal.show .modal-card { transform: translateY(0) scale(1); }
.modal-card h2 { margin-bottom: 8px; }
.modal-card > p.muted { margin-bottom: 24px; }
.modal-close { position: absolute; top: 24px; right: 24px; background: transparent; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; transition: color 0.2s; padding: 0; }
.modal-close:hover { color: var(--danger); }

.toast { position: fixed; right: 24px; bottom: 24px; background: var(--navy-dark); color: white; padding: 16px 24px; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); z-index: 120; display: flex; align-items: center; gap: 12px; font-weight: 500; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.toast.show { transform: translateY(0); opacity: 1; }
.toast i { color: var(--success); font-size: 1.25rem; }

.empty { padding: 60px 24px; text-align: center; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.empty i { font-size: 3rem; color: var(--border); }

/* Calculator UI inside Modal */
.calc-result { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px; margin-top: 16px; }
.calc-result h3 { font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.calc-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.875rem; color: var(--text-muted); }
.calc-row strong { color: var(--navy-dark); }
.calc-total { display: flex; justify-content: space-between; align-items: center; font-size: 1.125rem; font-weight: 700; padding-top: 16px; margin-top: 8px; border-top: 1px dashed var(--border); color: var(--success); }

/* Responsive */
@media(max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 24px 16px 90px; }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .two { grid-template-columns: 1fr; }
  .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); z-index: 50; padding: 8px 16px; justify-content: space-around; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .mobile-nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text-muted); font-size: 0.65rem; font-weight: 600; padding: 8px; }
  .mobile-nav button i { font-size: 1.5rem; margin-bottom: 2px; }
  .mobile-nav button.active { color: var(--primary); }
  .mobile-nav button.active i { font-weight: 700; }
  .top-actions .hide-mobile { display: none; }
}
@media(max-width: 600px) {
  .hero h1 { font-size: 2.25rem; }
  .cards { grid-template-columns: 1fr; }
  .page-head { flex-direction: column; align-items: stretch; gap: 16px; }
  .demo-banner { flex-direction: column; align-items: stretch; text-align: left; }
  .demo-banner .btn { width: 100%; justify-content: center; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>

function ownerReservationStats(records){
  const total=records.length;
  const pending=records.filter(r=>r.status==='Reserved').length;
  const collected=records.filter(r=>r.status==='Collected').length;
  const cancelled=records.filter(r=>r.status==='Cancelled').length;
  const value=records.filter(r=>r.status!=='Cancelled').reduce((a,r)=>a+r.price*r.qty,0);
  return {total,pending,collected,cancelled,value};
}

  ];
  return `${header()}<div class="shell"><aside class="sidebar"><div class="side-title">Student / Customer<small>Affordable meals in Malaysia</small></div><nav class="nav">${navItems.map(x=>`<button class="${active===x.id?'active':''}" onclick="go('student/${x.id}')"><i class="ph ${x.icon}"></i> ${x.label}</button>`).join('')}</nav></aside><main class="main">${content}</main></div><nav class="mobile-nav">${navItems.filter(x=>['browse','near','reservations','profile'].includes(x.id)).map(x=>`<button class="${active===x.id?'active':''}" onclick="go('student/${x.id}')"><i class="ph ${x.icon}"></i> ${x.label.split(' ')[0]}</button>`).join('')}</nav>`}

function foodCards(){return `<div class="food-grid">${state.foods.filter(f=>f.status==='Available').map(f=>`<article class="food-card"><div class="food-visual"><span class="badge ${f.type==='Donation'?'donated':'available'}">${f.type}</span>${f.image?`<img src="${f.image}" alt="${f.name}">`:f.emoji}</div><div class="food-body"><div class="muted small" style="margin-bottom:4px"><i class="ph-fill ph-storefront"></i> The Garden Kitchen • 1.2 km</div><h3>${f.name}</h3><div class="price"><strong>${money(f.offer)}</strong><span class="old">${money(f.price)}</span><span class="off">${pct(f.price,f.offer)}% OFF</span></div><div class="food-meta"><span><i class="ph ph-package"></i> ${f.qty} left</span><span><i class="ph-fill ph-star" style="color:var(--primary)"></i> 4.7</span></div><button class="btn btn-dark" style="width:100%" onclick="showFood('${f.name}')">View & Reserve</button></div></article>`).join('')}</div>`}

function showFood(name){const f=state.foods.find(x=>x.name===name);openModal(`<h2>${f.image?`<img src="${f.image}" alt="${f.name}" style="width:42px;height:42px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">`:f.emoji} ${f.name}</h2><p class="muted"><i class="ph-fill ph-storefront"></i> The Garden Kitchen • Alor Setar, Kedah</p><div class="price" style="margin:24px 0"><strong>${money(f.offer)}</strong><span class="old">${money(f.price)}</span><span class="off">${pct(f.price,f.offer)}% OFF</span></div><div class="notice"><i class="ph-fill ph-clock"></i> <div><b>Pickup today.</b> Available quantity: ${f.qty}.<br>One student = one meal per distribution period.</div></div><button class="btn btn-primary" style="width:100%; padding:14px" onclick="reserveFood('${f.name}')">Reserve Meal</button><button class="btn btn-ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Continue Browsing</button>`)}

function reserveFood(name){if(state.auth!=='student'){openModal(`<h2>Reserve your meal</h2><p class="muted">Create an account or log in to reserve your meal securely.</p><div class="auth-options" style="margin-top:24px"><button class="btn btn-dark" onclick="closeModal();showLogin('student')"><i class="ph ph-sign-in"></i> Log In</button><button class="btn btn-primary" onclick="closeModal();showSignup('student')"><i class="ph ph-user-plus"></i> Create Account</button><button class="btn btn-ghost" onclick="closeModal()">Continue Browsing</button></div>`);return}const f=state.foods.find(x=>x.name===name);if(f.qty>0){f.qty--;const now=new Date();const slot=`${((now.getHours()+1-1)%12)||12}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours()+1>=12?'PM':'AM'} – ${((now.getHours()+2-1)%12)||12}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours()+2>=12?'PM':'AM'}`;state.records.unshift({id:'RES'+Math.floor(1000+Math.random()*8999),meal:f.name,emoji:f.emoji,category:f.category,qty:1,status:'Reserved',restaurant:'The Garden Kitchen',price:f.type==='Donation'?0:f.offer,originalPrice:f.price,date:'Today',time:slot,customer:'Demo Student',studentId:'AIU2510XXX'});closeModal();toast('Meal reserved successfully');go('student/reservations')}}

function reservationStats(records){
  const total=records.length;
  const active=records.filter(r=>r.status==='Reserved').length;
  const collected=records.filter(r=>r.status==='Collected').length;
  const saved=records.filter(r=>r.status!=='Cancelled').reduce((a,r)=>a+(r.originalPrice-r.price)*r.qty,0);
  return {total,active,collected,saved};
}

function studentReservationsHTML(){
  const filter=state.reservationsFilter||'All';
  const tabs=['All','Reserved','Collected','Cancelled'];
  const records=filter==='All'?state.records:state.records.filter(r=>r.status===filter);
  const s=reservationStats(state.records);
  return `<div id="studentReservations">
    <div class="page-head"><div><h1>My Reservations</h1><p class="muted">Your meal pickup history and active reservations.</p></div></div>
    <div class="cards">
      <div class="stat"><div class="label">Total Reservations</div><div class="value">${s.total}</div></div>
      <div class="stat"><div class="label">Awaiting Pickup</div><div class="value">${s.active}</div><div class="delta"><i class="ph ph-clock"></i> Reserved</div></div>
      <div class="stat"><div class="label">Meals Collected</div><div class="value">${s.collected}</div></div>
      <div class="stat"><div class="label">Total Saved</div><div class="value">${money(s.saved)}</div><div class="delta"><i class="ph ph-piggy-bank"></i> vs original price</div></div>
    </div>
    <section class="panel">
      <div class="nav" style="flex-direction:row;flex-wrap:wrap;gap:8px;margin-bottom:20px">${tabs.map(t=>`<button class="btn ${filter===t?'btn-primary':'btn-ghost'}" style="padding:8px 14px" onclick="setReservationsFilter('${t}')">${t}</button>`).join('')}</div>
      ${records.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Reservation</th><th>Meal</th><th>Qty</th><th>Price</th><th>Restaurant</th><th>Pickup</th><th>Status</th><th></th></tr></thead><tbody>${records.map(r=>`<tr><td><b>#${r.id}</b></td><td>${r.emoji} ${r.meal}<div class="muted small">${r.category}</div></td><td>${r.qty}</td><td><strong>${r.price?money(r.price):'FREE'}</strong>${r.originalPrice&&r.originalPrice!==r.price?`<div class="old small">${money(r.originalPrice)}</div>`:''}</td><td>${r.restaurant}</td><td>${r.date}<div class="muted small">${r.time}</div></td><td><span class="badge ${r.status.toLowerCase()}">${r.status}</span></td><td>${r.status==='Reserved'?`<button class="btn btn-ghost small" onclick="cancelReservation('${r.id}')"><i class="ph ph-x-circle"></i> Cancel</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><i class="ph ph-ticket"></i><p>No ${filter==='All'?'':filter.toLowerCase()+' '}reservations yet.</p></div>`}
    </section>
  </div>`
}

function setReservationsFilter(f){state.reservationsFilter=f;const el=document.getElementById('studentReservations');if(el)el.outerHTML=studentReservationsHTML()}

function cancelReservation(id){const r=state.records.find(x=>x.id===id);if(r&&r.status==='Reserved'){r.status='Cancelled';const f=state.foods.find(x=>x.name===r.meal);if(f)f.qty+=r.qty;toast('Reservation cancelled');const el=document.getElementById('studentReservations');if(el)el.outerHTML=studentReservationsHTML()}}

function studentPage(p){if(p==='browse'||p==='dashboard')return studentShell(`<div class="page-head"><div><h1>Good day 👋</h1><p class="muted">Affordable meals available now near you.</p></div><button class="btn btn-primary" onclick="go('student/near')"><i class="ph ph-map-pin"></i> Near Me</button></div><div class="notice"><i class="ph-fill ph-info"></i> <div>🇲🇾 Prices shown in RM. Reserve one meal per distribution period and collect it at the restaurant.</div></div><h3 style="margin: 32px 0 24px">Food Available Now</h3>${foodCards()}`,p);if(p==='near')return studentShell(`<div class="page-head"><div><h1>Near Me</h1><p class="muted">Find discounted and donated food around Alor Setar.</p></div></div><section class="panel" style="margin-bottom:32px"><div class="form-grid"><div class="field"><label>Max Distance</label><select><option>Within 2 km</option><option>Within 5 km</option><option>Within 10 km</option></select></div><div class="field"><label>Category</label><select><option>All categories</option><option>Rice</option><option>Noodles</option><option>Vegetables</option></select></div></div></section>${foodCards()}`,p);if(p==='reservations')return studentShell(studentReservationsHTML(),p);if(p==='reviews')return studentShell(`<div class="page-head"><div><h1>My Reviews</h1><p class="muted">Share feedback after collecting your meals.</p></div></div><section class="panel"><div class="empty"><i class="ph ph-star"></i><p>No reviews yet. Your collected meals will appear here.</p></div></section>`,p);return studentShell(`<div class="page-head"><div><h1>My Profile</h1><p class="muted">Manage your student information.</p></div></div><section class="panel"><div class="form"><div class="form-grid"><div class="field"><label>Full Name</label><input value="Demo Student"></div><div class="field"><label>Student ID</label><input value="AIU2510XXX"></div><div class="field"><label>University / College</label><input value="University in Malaysia"></div><div class="field"><label>Email</label><input value="student@example.com"></div></div><button class="btn btn-primary" style="margin-top:16px" onclick="toast('Profile saved')"><i class="ph ph-floppy-disk"></i> Save Changes</button></div></section>`,p)}

function about(){return `${header()}<main class="hero" style="min-height: auto; padding: 40px 24px; align-items: flex-start; text-align: left;"><div style="max-width: 900px; margin: 0 auto; width: 100%;">
  <div class="page-head" style="margin-bottom: 40px;"><div><h1>About Israf Guard</h1><p class="muted" style="font-size: 1.125rem;">Technology that turns surplus food into affordable meals and measurable impact.</p></div></div>
  <div class="two">
    <section class="panel" style="padding: 32px">
      <h3 style="margin-bottom: 16px"><i class="ph-fill ph-target" style="color:var(--primary)"></i> Our Mission</h3>
      <p class="muted" style="line-height:1.8; margin-bottom: 16px">Israf Guard is designed for Malaysia: helping restaurants reduce edible food waste while making affordable meals more accessible to students and customers.</p>
      <p class="muted" style="line-height:1.8">Restaurants can list surplus meals, apply discounts or donations, track reservations, and understand the financial and social impact of their food.</p>
    </section>
    <section class="panel" style="padding: 32px">
      <h3 style="margin-bottom: 16px"><i class="ph-fill ph-lightbulb" style="color:var(--primary)"></i> How It Works</h3>
      <ol class="muted" style="line-height:2.2; padding-left: 20px;">
        <li>Restaurants list surplus food.</li>
        <li>Israf Guard calculates offers.</li>
        <li>Students discover nearby meals.</li>
        <li>Students reserve and collect.</li>
        <li>Restaurants see records & impact.</li>
      </ol>
    </section>
  </div>
</div></main>`}

function productionOverviewHTML(){const p=state.predictions;return `<section class="panel"><h3 style="margin-bottom:8px"><i class="ph-fill ph-chart-line-up" style="color:var(--primary)"></i> Prediction Overview</h3><p class="muted small" style="margin-bottom:20px">Predicted sales and meals for tomorrow, based on recent demand trends.</p><div class="cards">${p.items.map(f=>`<div class="stat"><div class="label">${f.emoji} ${f.name}</div><div class="value">${f.predicted}</div><div class="delta"><i class="ph ph-trend-up"></i> predicted meals</div></div>`).join('')}</div><div class="cards" style="margin-top:24px"><div class="stat"><div class="label">Predicted Sales (Tomorrow)</div><div class="value">${money(p.predictedSales)}</div><div class="delta"><i class="ph ph-trend-up"></i> Demand forecast</div></div><div class="stat"><div class="label">Predicted Profit (Tomorrow)</div><div class="value">${money(p.predictedProfit)}</div><div class="delta"><i class="ph ph-trend-up"></i> Demand forecast</div></div><div class="stat"><div class="label">Yesterday's Sales</div><div class="value">${money(p.yesterdaySales)}</div></div><div class="stat"><div class="label">Yesterday's Wasted Meals</div><div class="value">${p.yesterdayWaste}</div><div class="delta" style="background:var(--danger-light);color:#991B1B"><i class="ph ph-trend-down"></i> Meals unsold</div></div></div></section>`}

function recordsSectionHTML(){
  const period=state.recordsFilter||'month';
  const d=state.salesHistory[period];
  const label=recordsPeriods.find(x=>x.id===period).label;
  const trend=d.prevSales?(((d.sales-d.prevSales)/d.prevSales)*100):0;
  const up=trend>=0;
  const paidMeals=Math.max(1,d.meals-d.donations);
  const avgOrder=d.sales/paidMeals;
  const cost=d.sales-d.profit;
  return `<section class="panel" id="recordsSection">
    <h3 style="margin-bottom:8px"><i class="ph-fill ph-receipt" style="color:var(--primary)"></i> Records — Sales</h3>
    <p class="muted small" style="margin-bottom:20px">Generated sales numbers for last month by default. Use filters to change the period.</p>
    <div class="nav" style="flex-direction:row;flex-wrap:wrap;gap:8px;margin-bottom:20px">${recordsPeriods.map(x=>`<button class="btn ${period===x.id?'btn-primary':'btn-ghost'}" style="padding:8px 14px" onclick="setRecordsFilter('${x.id}')">${x.label}</button>`).join('')}</div>
    <div class="cards">
      <div class="stat"><div class="label">Total Sales (${label})</div><div class="value">${money(d.sales)}</div><div class="delta" ${up?'':'style="background:var(--danger-light);color:#991B1B"'}><i class="ph ph-trend-${up?'up':'down'}"></i> ${up?'+':''}${trend.toFixed(1)}% vs prior period</div></div>
      <div class="stat"><div class="label">Meals Sold</div><div class="value">${d.meals}</div><div class="delta"><i class="ph ph-fork-knife"></i> ${paidMeals} paid • ${d.donations} donated</div></div>
      <div class="stat"><div class="label">Donations Given</div><div class="value">${d.donations}</div></div>
      <div class="stat"><div class="label">Avg. Order Value</div><div class="value">${money(avgOrder)}</div></div>
      <div class="stat"><div class="label">Estimated Profit</div><div class="value">${money(d.profit)}</div><div class="delta"><i class="ph ph-trend-up"></i> ${Math.round(d.profit/d.sales*100)}% margin</div></div>
    </div>
    <div class="two">
      <section class="panel" style="margin-bottom:0"><h3 style="margin-bottom:16px">Top Selling Items (${label})</h3><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Units Sold</th><th>Share</th></tr></thead><tbody>${d.topItems.map(t=>`<tr><td>${t.emoji} ${t.name}</td><td>${t.sold}</td><td>${Math.round(t.sold/d.meals*100)}%</td></tr>`).join('')}</tbody></table></div></section>
      <section class="panel" style="margin-bottom:0"><h3 style="margin-bottom:16px">Revenue Breakdown</h3><div class="calc-result"><div class="calc-row"><span>Gross revenue (${label})</span><strong>${money(d.sales)}</strong></div><div class="calc-row"><span>Estimated cost of goods</span><strong>${money(cost)}</strong></div><div class="calc-row"><span>Meals donated (value)</span><strong>${money(d.donations*avgOrder)}</strong></div><div class="calc-total"><span>Estimated Profit</span> <span>${money(d.profit)}</span></div></div></section>
    </div>
  </section>`
}

function setRecordsFilter(period){state.recordsFilter=period;const el=document.getElementById('recordsSection');if(el)el.outerHTML=recordsSectionHTML()}

function activePromotionsHTML(){const promos=state.foods.filter(f=>f.type==='Discount'||f.type==='Donation');if(!promos.length)return '<p class="muted">No active promotions yet.</p>';return `<div class="food-grid">${promos.map(f=>`<article class="food-card"><div class="food-visual"><span class="badge ${f.type==='Donation'?'donated':'available'}">${f.type}</span>${f.image?`<img src="${f.image}" alt="${f.name}">`:f.emoji}</div><div class="food-body"><h3>${f.name}</h3><div class="muted small">${f.qty} available</div><div class="price"><strong>${f.type==='Donation'?'FREE':money(f.offer)}</strong><span class="old">${money(f.price)}</span><span class="off">${pct(f.price,f.offer)}% OFF</span></div></div></article>`).join('')}</div>`}

function donateDiscountFormHTML(){return `<section class="panel"><h3 style="margin-bottom:8px"><i class="ph-fill ph-tag" style="color:var(--primary)"></i> Donate / Discount</h3><p class="muted small" style="margin-bottom:20px">Enter a dish, available quantity, and discounted price — Israf Guard creates the promotion automatically.</p><div class="form-grid"><div class="field"><label>Dish Type</label><select id="ddDish">${Object.keys(dishCatalog).map(k=>`<option>${k}</option>`).join('')}</select></div><div class="field"><label>Available Quantity</label><input id="ddQty" type="number" min="1" value="10"></div></div><div class="field" style="margin-top:16px"><label>Discounted Price (RM)</label><input id="ddPrice" type="number" min="0" step="0.5" value="4"></div><button class="btn btn-primary" style="margin-top:16px" onclick="createPromotion()"><i class="ph ph-magic-wand"></i> Create Promotion Automatically</button></section><section class="panel"><h3 style="margin-bottom:16px">Active Promotions</h3><div id="promoList">${activePromotionsHTML()}</div></section>`}

function createPromotion(){const dish=document.getElementById('ddDish').value;const qty=+document.getElementById('ddQty').value||0;const offer=+document.getElementById('ddPrice').value||0;const meta=dishCatalog[dish]||{emoji:'🍽️',price:8};const type=offer<=0?'Donation':'Discount';state.foods.unshift({id:Date.now(),name:dish,emoji:meta.emoji,category:'Promotion',qty,price:meta.price,offer:type==='Donation'?0:offer,type,status:type==='Donation'?'Donated':'Available'});const el=document.getElementById('promoList');if(el)el.innerHTML=activePromotionsHTML();toast(`Promotion created automatically: ${pct(meta.price,type==='Donation'?0:offer)}% OFF ${dish}`)}

function ownerDemoRoute(){return ownerShell('dashboard',`${demoBanner()}<div class="page-head"><div><h1>Demo Restaurant</h1><p class="muted">Explore the full owner experience before creating an account.</p></div></div>${productionOverviewHTML()}${recordsSectionHTML()}${donateDiscountFormHTML()}`) }

function render(){const path=location.hash.replace(/^#/,'')||'home';let html='';if(path==='home')html=landing();else if(path==='student-auth')html=auth('student');else if(path==='owner-auth')html=auth('owner');else if(path==='about')html=about();else if(path.startsWith('owner/')){const p=path.split('/')[1];if(p==='signup'){showSignup('owner');html=ownerDemoRoute()}else html=p==='dashboard'?ownerDashboard():p==='production'?production():ownerPages.includes(p)?simpleOwnerPage(p):ownerDashboard()}else if(path.startsWith('student/')){const p=path.split('/')[1];html=studentPage(p)}else html=landing();document.getElementById('app').innerHTML=html;window.scrollTo(0,0)}

window.addEventListener('hashchange',render);window.addEventListener('load',render);window.go=go;window.showLogin=showLogin;window.showSignup=showSignup;window.showAddFood=showAddFood;window.toggleOffer=toggleOffer;window.liveCalc=liveCalc;window.addFood=addFood;window.showDiscount=showDiscount;window.toggleDiscountModal=toggleDiscountModal;window.discountModalCalc=discountModalCalc;window.showFood=showFood;window.reserveFood=reserveFood;window.closeModal=closeModal;window.setRecordsFilter=setRecordsFilter;window.createPromotion=createPromotion;window.setReservationsFilter=setReservationsFilter;window.cancelReservation=cancelReservation;window.setOwnerRecordsFilter=setOwnerRecordsFilter;window.markCollected=markCollected;
</script>
</body></html>
