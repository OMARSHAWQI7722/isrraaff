<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Israf Guard — Malaysian Food Waste Reduction</title>
<meta name="description" content="Israf Guard connects students with affordable meals while helping Malaysian restaurants reduce food waste.">
<style>
:root{--gold:#FFC107;--gold2:#f4b400;--navy:#1F2937;--navy2:#111827;--green:#10B981;--bg:#f6f7f9;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--danger:#ef4444;--shadow:0 16px 40px rgba(31,41,55,.09);--radius:22px}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--navy)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;letter-spacing:-.4px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:12px;background:var(--navy)}.brand span{color:var(--navy)}.brand b{color:var(--gold2)}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--gold);color:#111827;box-shadow:0 8px 20px rgba(255,193,7,.22)}.btn-dark{background:var(--navy);color:white}.btn-ghost{background:white;border:1px solid var(--line);color:var(--navy)}.btn-green{background:var(--green);color:white}.btn-danger{background:#fee2e2;color:#991b1b}.small{font-size:13px}.muted{color:var(--muted)}.container{max-width:1200px;margin:auto;padding:28px}.hero{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:50px 20px;background:radial-gradient(circle at 10% 10%,rgba(255,193,7,.18),transparent 30%),radial-gradient(circle at 90% 80%,rgba(16,185,129,.12),transparent 30%),var(--bg)}.hero-inner{max-width:980px;text-align:center}.hero-logo{width:100px;height:100px;border-radius:28px;object-fit:contain;background:var(--navy);padding:10px;box-shadow:0 20px 45px rgba(31,41,55,.18)}.eyebrow{display:inline-flex;gap:8px;align-items:center;background:#fff7d6;color:#8a6500;border:1px solid #ffe083;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;margin:18px 0}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.98;letter-spacing:-3px;margin:8px 0 18px}.hero h1 span{color:var(--gold2)}.hero p{font-size:19px;line-height:1.7;color:var(--muted);max-width:760px;margin:0 auto 34px}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px;text-align:left}.role-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.role-card:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,193,7,.12);right:-50px;top:-50px}.role-icon{width:58px;height:58px;border-radius:18px;background:#fff8df;display:grid;place-items:center;font-size:29px;margin-bottom:22px}.role-card h2{margin:0 0 8px;font-size:24px}.role-card p{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 22px}.role-card .btn{width:100%}.hero-foot{margin-top:28px;color:#8b929e;font-size:13px}.auth-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:40px 20px}.auth-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:34px}.auth-head{display:flex;gap:14px;align-items:center;margin-bottom:25px}.auth-head .icon{width:52px;height:52px;border-radius:16px;background:#fff8df;display:grid;place-items:center;font-size:25px}.auth-card h1{margin:0 0 5px}.auth-options{display:grid;gap:12px}.auth-options .btn{padding:15px}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid #d9dee6;border-radius:13px;outline:none;background:white}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 4px rgba(255,193,7,.13)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.page{min-height:calc(100vh - 72px)}.shell{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}.sidebar{background:var(--navy2);color:white;padding:22px 14px;position:sticky;top:72px;height:calc(100vh - 72px)}.side-title{padding:4px 12px 18px;color:#fff;font-weight:900}.side-title small{display:block;color:#9ca3af;font-weight:600;margin-top:4px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 13px;border-radius:12px;font-weight:700}.nav button:hover,.nav button.active{background:rgba(255,193,7,.13);color:white}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.side-bottom{position:absolute;bottom:20px;left:14px;right:14px}.main{padding:30px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.page-head h1{margin:0 0 5px;font-size:32px;letter-spacing:-1px}.page-head p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 25px rgba(31,41,55,.05)}.stat .label{color:var(--muted);font-size:13px;font-weight:700}.stat .value{font-size:30px;font-weight:900;margin-top:8px}.stat .delta{font-size:12px;color:var(--green);font-weight:800;margin-top:4px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 25px rgba(31,41,55,.05)}.panel h3{margin:0 0 16px}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px}.chart{height:250px;display:flex;align-items:end;gap:10px;padding:20px 8px 8px}.bar{flex:1;background:linear-gradient(180deg,var(--gold),#ffe082);border-radius:9px 9px 3px 3px;min-height:15px;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}.available{background:#dcfce7;color:#166534}.reserved{background:#dbeafe;color:#1d4ed8}.donated{background:#ede9fe;color:#6d28d9}.sold{background:#fef3c7;color:#92400e}.expired{background:#f3f4f6;color:#6b7280}.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.food-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 25px rgba(31,41,55,.05)}.food-visual{height:145px;background:linear-gradient(135deg,#fff5ce,#eafaf4);display:grid;place-items:center;font-size:70px;overflow:hidden}.food-visual img{width:100%;height:100%;object-fit:cover;display:block}.food-body{padding:17px}.food-body h3{margin:0 0 5px}.price{display:flex;align-items:baseline;gap:9px;margin:12px 0}.price strong{font-size:23px}.old{text-decoration:line-through;color:#9ca3af}.off{color:#059669;font-size:12px;font-weight:900}.food-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 0}.calc{display:grid;grid-template-columns:1fr 1fr;gap:18px}.calc-result{background:var(--navy);color:white;border-radius:20px;padding:22px}.calc-result h3{margin:0 0 16px}.calc-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}.calc-total{font-size:22px;font-weight:900;padding-top:16px}.notice{padding:14px 16px;border-radius:14px;background:#fff8df;border:1px solid #ffe083;color:#735600;margin-bottom:18px;font-size:13px}.demo-banner{background:linear-gradient(135deg,var(--navy2),#243246);color:white;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.demo-banner b{color:var(--gold)}.mobile-nav{display:none}.back{margin-bottom:15px}.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;place-items:center;padding:20px;z-index:100}.modal.show{display:grid}.modal-card{background:white;border-radius:24px;width:min(470px,100%);padding:26px}.modal-card h2{margin-top:0}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy2);color:white;padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);display:none;z-index:120}.toast.show{display:block}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:20px 16px;padding-bottom:90px}.cards{grid-template-columns:1fr 1fr}.two,.calc{grid-template-columns:1fr}.food-grid{grid-template-columns:1fr 1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(17,24,39,.97);z-index:50;padding:9px 8px;justify-content:space-around}.mobile-nav button{background:none;border:0;color:#cbd5e1;font-size:10px;font-weight:800}.mobile-nav button span{display:block;font-size:19px;margin-bottom:2px}.topbar{padding:0 14px}.top-actions .hide-mobile{display:none}}@media(max-width:600px){.role-grid{grid-template-columns:1fr}.hero{padding:35px 16px}.hero h1{letter-spacing:-2px}.hero p{font-size:16px}.auth-card{padding:24px}.form-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.food-grid{grid-template-columns:1fr}.page-head{align-items:stretch;flex-direction:column}.demo-banner{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div class="modal-card" id="modalContent"></div></div>
<div id="toast" class="toast"></div>
<script>
const logo='assets/israf-guard-logo.png';
const state={role:null,auth:null,foods:[
{id:1,name:'Nasi Lemak',emoji:'🍚',image:'assets/nasi-lemak.jpg',category:'Rice',qty:8,price:10,offer:5,type:'Discount',status:'Available'},
{id:2,name:'Chicken Rice',emoji:'🍗',image:'assets/chicken-rice.jpg',category:'Chicken',qty:10,price:12,offer:6,type:'Discount',status:'Available'},
{id:3,name:'Roti Canai',emoji:'🥞',image:'assets/roti-canai.jpg',category:'Breakfast',qty:12,price:6,offer:3,type:'Discount',status:'Available'},
{id:4,name:'Nasi Kandar',emoji:'🍛',image:'assets/nasi-kandar.jpg',category:'Rice',qty:6,price:14,offer:8,type:'Discount',status:'Available'},
{id:5,name:'Mee Goreng',emoji:'🍜',image:'assets/mee-goreng.jpg',category:'Noodles',qty:9,price:8,offer:4,type:'Discount',status:'Available'},
{id:6,name:'Laksa',emoji:'🍜',image:'assets/laksa.jpg',category:'Noodles',qty:7,price:12,offer:6,type:'Discount',status:'Available'},
{id:7,name:'Satay',emoji:'🍢',image:'assets/satay.jpg',category:'Grilled',qty:10,price:12,offer:6,type:'Discount',status:'Available'},
{id:8,name:'Curry Mee',emoji:'🍜',image:'assets/curry-mee.jpg',category:'Noodles',qty:8,price:10,offer:5,type:'Discount',status:'Available'},
{id:9,name:'Vegetable Rice',emoji:'🥬',image:'assets/vegetable-rice.jpg',category:'Vegetables',qty:5,price:8,offer:0,type:'Donation',status:'Available'}],records:[
['RES1024','Chicken Rice',1,'Reserved'],['RES1025','Spaghetti',1,'Collected'],['RES1026','Vegetable Rice',1,'Reserved']],productionCount:250};
const ownerPages=['dashboard','production','waste-food','records','revenue','donate-discount','account'];
function money(n){return 'RM '+Number(n).toFixed(2)}
function pct(price,offer){return price?Math.round((1-offer/price)*100):0}
function go(path){location.hash=path}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function header(){return `<header class="topbar"><div class="brand"><img src="${logo}"><span>Israf <b>Guard</b></span></div><div class="top-actions">${state.role?`<button class="btn btn-ghost small hide-mobile" onclick="go('home')">Switch Role</button>`:''}<button class="btn btn-primary small" onclick="go('about')">Our Mission</button></div></header>`}
function landing(){return `${header()}<main class="hero"><div class="hero-inner"><img class="hero-logo" src="${logo}"><div class="eyebrow">🇲🇾 Malaysian Social Business • RM Pricing • Food Waste Reduction</div><h1>Discover Food.<br><span>Reduce Waste.</span><br>Make an Impact.</h1><p>Connecting students with affordable meals, discounts, and food donations while helping Malaysian restaurants turn surplus food into value.</p><div class="role-grid"><article class="role-card"><div class="role-icon">🎓</div><h2>Student / Customer</h2><p>Find affordable meals, discounts, donations, and restaurants near you.</p><button class="btn btn-dark" onclick="go('student-auth')">Continue as Student</button></article><article class="role-card"><div class="role-icon">🍽️</div><h2>Restaurant Owner</h2><p>List surplus food, track reservations, reduce waste, and create additional value.</p><button class="btn btn-primary" onclick="go('owner-auth')">Continue as Restaurant Owner</button></article></div><div class="hero-foot">Built for Malaysia • Affordable food • Smarter restaurant operations • Less waste</div></div></main>`}
function auth(role){const isS=role==='student';return `${header()}<main class="auth-wrap"><section class="auth-card"><button class="btn btn-ghost small back" onclick="go('home')">← Back</button><div class="auth-head"><div class="icon">${isS?'🎓':'🍽️'}</div><div><h1>${isS?'Student':'Restaurant Owner'}</h1><div class="muted">Choose how you want to continue</div></div></div><div class="auth-options"><button class="btn btn-dark" onclick="showLogin('${role}')">Log In</button><button class="btn btn-primary" onclick="showSignup('${role}')">Sign Up</button><button class="btn btn-ghost" onclick="${isS?"go('student/browse')":"go('owner/demo/dashboard')"}">Continue as Guest</button></div><div class="notice" style="margin-top:18px;margin-bottom:0">${isS?'Guest browsing is available. A free account is required before reserving a meal.':'Guest access opens a safe fictional Demo Mode so owners can explore the platform before creating an account.'}</div></section></main>`}
function showLogin(role){openModal(`<h2>${role==='student'?'Student':'Restaurant Owner'} Log In</h2><div class="form"><div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div><button class="btn btn-dark" onclick="closeModal();${role==='student'?"go('student/dashboard')":"go('owner/dashboard')"}">Log In</button><button class="btn btn-ghost" onclick="toast('Password reset link prepared');">Forgot password?</button></div>`)}
function showSignup(role){openModal(`<h2>Create ${role==='student'?'Student':'Restaurant Owner'} Account</h2><div class="form"><div class="form-grid"><div class="field"><label>${role==='student'?'Full Name':'Owner Name'}</label><input placeholder="Your name"></div><div class="field"><label>Phone Number</label><input placeholder="+60"></div></div><div class="field"><label>${role==='student'?'Email':'Email'}</label><input type="email" placeholder="you@example.com"></div>${role==='student'?`<div class="form-grid"><div class="field"><label>Student ID</label><input placeholder="Student ID"></div><div class="field"><label>University / College</label><input placeholder="University"></div></div>`:`<div class="form-grid"><div class="field"><label>Restaurant Name</label><input placeholder="Restaurant name"></div><div class="field"><label>Restaurant Category</label><select><option>Malaysian</option><option>Mamak</option><option>Chinese Malaysian</option><option>Indian Malaysian</option><option>Cafe</option></select></div><div class="field"><label>Location</label><input placeholder="City, State"></div></div>`}<div class="form-grid"><div class="field"><label>Password</label><input type="password" placeholder="Create password"></div><div class="field"><label>Confirm Password</label><input type="password" placeholder="Repeat password"></div></div><button class="btn btn-primary" onclick="closeModal();toast('Account created successfully');${role==='student'?"go('student/dashboard')":"go('owner/dashboard')"}">Create Account</button></div>`)}
function ownerShell(page,content){return `${header()}<div class="shell"><aside class="sidebar"><div class="side-title">Restaurant Owner<small>The Garden Kitchen • Demo</small></div><nav class="nav">${ownerPages.map(p=>`<button class="${page===p?'active':''}" onclick="go('owner/${p}')">${({dashboard:'▦ Dashboard',production:'＋ Production','waste-food':'♻ Waste Food',records:'▤ Records',revenue:'◉ Revenue','donate-discount':'◇ Donate or Discount',account:'◎ My Account'})[p]}</button>`).join('')}</nav><div class="side-bottom"><button class="btn btn-primary" style="width:100%" onclick="go('owner/signup')">Create Restaurant Account</button></div></aside><main class="main">${content}</main></div><nav class="mobile-nav">${[['dashboard','▦','Home'],['production','＋','Add Food'],['records','▤','Records'],['revenue','◉','Revenue'],['account','◎','Account']].map(x=>`<button onclick="go('owner/${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function demoBanner(){return `<div class="demo-banner"><div><b>● DEMO MODE</b><div class="small" style="margin-top:6px;color:#cbd5e1">All information shown here is fictional sample data. Demo mode never modifies real restaurant data.</div></div><button class="btn btn-primary" onclick="go('owner/signup')">Create Your Restaurant Account</button></div>`}
function ownerDashboard(){const total=state.foods.reduce((a,f)=>a+f.qty,0);return ownerShell('dashboard',`${demoBanner()}<div class="page-head"><div><h1>The Garden Kitchen</h1><p>Alor Setar, Kedah, Malaysia • ⭐ 4.7/5 • 128 sample reviews</p></div><button class="btn btn-primary" onclick="go('owner/production')">+ Add Food</button></div><div class="cards"><div class="stat"><div class="label">Total Meals Listed</div><div class="value">${state.productionCount}</div><div class="delta">+12 this week</div></div><div class="stat"><div class="label">Reserved</div><div class="value">180</div><div class="delta">72% of listed</div></div><div class="stat"><div class="label">Collected</div><div class="value">165</div><div class="delta">92% collection rate</div></div><div class="stat"><div class="label">Waste Reduced</div><div class="value">${35+total}</div><div class="delta">Meals saved</div></div></div><div class="two"><section class="panel"><h3>Meal Activity</h3><div class="chart">${[45,62,52,78,66,91,72].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${['M','T','W','T','F','S','S'][i]}</span></div>`).join('')}</div></section><section class="panel"><h3>Quick Actions</h3><div style="display:grid;gap:10px"><button class="btn btn-ghost" onclick="go('owner/production')">＋ Add new food</button><button class="btn btn-ghost" onclick="go('owner/donate-discount')">◇ Set discount / donation</button><button class="btn btn-ghost" onclick="go('owner/records')">▤ View reservations</button><button class="btn btn-ghost" onclick="go('owner/revenue')">◉ View revenue</button></div></section></div>`)}
function production(){return ownerShell('production',`${demoBanner()}<div class="page-head"><div><h1>Production</h1><p>Add surplus food in seconds. Calculations are automatic.</p></div><button class="btn btn-primary" onclick="showAddFood()">+ Add Food</button></div><section class="panel"><h3>Current Food Production</h3><div class="table-wrap"><table class="table"><thead><tr><th>Food</th><th>Category</th><th>Quantity</th><th>Original</th><th>Offer</th><th>Action</th><th>Status</th></tr></thead><tbody>${state.foods.map(f=>`<tr><td><b style="display:flex;align-items:center;gap:9px"><img src="${f.image||''}" alt="${f.name}" style="width:48px;height:38px;object-fit:cover;border-radius:8px" onerror="this.style.display='none'"> ${f.name}</b></td><td>${f.category}</td><td>${f.qty}</td><td>${money(f.price)}</td><td>${f.type==='Donation'?'<b>FREE</b>':money(f.offer)+' ('+pct(f.price,f.offer)+'% OFF)'}</td><td><span class="badge ${f.type==='Donation'?'donated':'available'}">${f.type}</span></td><td><span class="badge ${f.status.toLowerCase()==='available'?'available':'donated'}">${f.status}</span></td></tr>`).join('')}</tbody></table></div></section>`)}
function showAddFood(){openModal(`<h2>+ Add Food</h2><p class="muted">Simple entry — the system calculates totals and discounts automatically.</p><div class="form"><div class="field"><label>Food Name</label><select id="foodName"><option>Nasi Lemak</option><option>Nasi Briyani</option><option>Chicken Rice</option><option>Ayam Goreng</option><option>Mee Goreng</option><option>Roti Canai</option><option>Vegetable Rice</option><option>Fried Rice</option></select></div><div class="form-grid"><div class="field"><label>Category</label><select id="foodCat"><option>Rice</option><option>Chicken</option><option>Noodles</option><option>Vegetables</option><option>Breakfast</option><option>Drinks</option><option>Dessert</option></select></div><div class="field"><label>Quantity Produced</label><input id="foodQty" type="number" min="1" value="10"></div></div><div class="form-grid"><div class="field"><label>Original Price (RM)</label><input id="foodPrice" type="number" min="0" step="0.50" value="8"></div><div class="field"><label>Action</label><select id="foodType" onchange="toggleOffer()"><option>Discount</option><option>Donation</option></select></div></div><div id="offerBox" class="field"><label>Discounted Price (RM)</label><input id="foodOffer" type="number" min="0" step="0.50" value="4" oninput="liveCalc()"></div><div class="calc-result"><h3>Automatic Calculation</h3><div class="calc-row"><span>Original Total</span><strong id="origTotal">RM 80.00</strong></div><div class="calc-row"><span>Final Total</span><strong id="finalTotal">RM 40.00</strong></div><div class="calc-row"><span>Discount</span><strong id="discountPct">50%</strong></div><div class="calc-total">You save: <span id="saveTotal">RM 40.00</span></div></div><button class="btn btn-primary" onclick="addFood()">Add Food</button></div>`)}
function toggleOffer(){const donation=document.getElementById('foodType').value==='Donation';document.getElementById('offerBox').style.display=donation?'none':'grid';liveCalc()}
function liveCalc(){const q=+document.getElementById('foodQty').value||0,p=+document.getElementById('foodPrice').value||0,t=document.getElementById('foodType').value,o=+document.getElementById('foodOffer').value||0;document.getElementById('origTotal').textContent=money(q*p);document.getElementById('finalTotal').textContent=t==='Donation'?'RM 0.00':money(q*o);document.getElementById('discountPct').textContent=t==='Donation'?'100%':pct(p,o)+'%';document.getElementById('saveTotal').textContent=money(q*(p-(t==='Donation'?0:o)))}
function addFood(){const name=document.getElementById('foodName').value,q=+document.getElementById('foodQty').value,p=+document.getElementById('foodPrice').value,t=document.getElementById('foodType').value,o=t==='Donation'?0:+document.getElementById('foodOffer').value;const emoji={"Nasi Lemak":"🍚","Nasi Briyani":"🍛","Chicken Rice":"🍗","Ayam Goreng":"🍗","Mee Goreng":"🍜","Roti Canai":"🥞","Vegetable Rice":"🥬","Fried Rice":"🍳"}[name]||'🍽️';const imageMap={"Nasi Lemak":"assets/nasi-lemak.jpg","Nasi Briyani":"assets/nasi-kandar.jpg","Chicken Rice":"assets/chicken-rice.jpg","Ayam Goreng":"assets/chicken-rice.jpg","Mee Goreng":"assets/mee-goreng.jpg","Roti Canai":"assets/roti-canai.jpg","Vegetable Rice":"assets/vegetable-rice.jpg","Fried Rice":"assets/mee-goreng.jpg"};state.foods.unshift({id:Date.now(),name,emoji,image:imageMap[name]||'',category:document.getElementById('foodCat').value,qty:q,price:p,offer:o,type:t,status:t==='Donation'?'Donated':'Available'});state.productionCount+=q;closeModal();toast(name+' added successfully');go('owner/production')}
function simpleOwnerPage(page){const data={
'waste-food':['Waste Food','Track prepared, sold, donated, and remaining meals.','♻️'],
'records':['Records','Review reservations and restaurant activity history.','▤'],
'revenue':['Revenue','Automatic revenue, sales, donation value, and profit insights.','◉'],
'donate-discount':['Donate or Discount','Choose how surplus meals create value instead of becoming waste.','◇'],
'account':['My Account','Manage restaurant details, owner information, and subscription.','◎']}[page];let body='';if(page==='waste-food')body=`<div class="cards"><div class="stat"><div class="label">Prepared</div><div class="value">250</div></div><div class="stat"><div class="label">Sold</div><div class="value">130</div></div><div class="stat"><div class="label">Donated</div><div class="value">35</div></div><div class="stat"><div class="label">Waste Reduced</div><div class="value">165</div></div></div><div class="two"><section class="panel"><h3>Waste Reduction Trend</h3><div class="chart">${[40,55,60,70,75,85,92].map((h,i)=>`<div class="bar" style="height:${h}%"><span>W${i+1}</span></div>`).join('')}</div></section><section class="panel"><h3>Impact</h3><p class="muted">Every discounted or donated meal keeps edible food in circulation and creates value for students and restaurants.</p><div class="notice">Goal: turn surplus into affordable meals before it becomes waste.</div></section></div>`;
if(page==='records')body=`<section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Reservation</th><th>Meal</th><th>Qty</th><th>Status</th></tr></thead><tbody>${state.records.map(r=>`<tr><td><b>#${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="badge ${r[3].toLowerCase()==='reserved'?'reserved':'available'}">${r[3]}</span></td></tr>`).join('')}</tbody></table></div></section>`;
if(page==='revenue')body=`<div class="cards"><div class="stat"><div class="label">Revenue</div><div class="value">RM 1,250</div><div class="delta">+14.2%</div></div><div class="stat"><div class="label">Estimated Profit</div><div class="value">RM 850</div></div><div class="stat"><div class="label">Meals Sold</div><div class="value">130</div></div><div class="stat"><div class="label">Donation Value</div><div class="value">RM 280</div></div></div><div class="two"><section class="panel"><h3>Revenue by Week</h3><div class="chart">${[35,48,58,64,52,75,88].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${i+1}</span></div>`).join('')}</div></section><section class="panel"><h3>Automatic Calculation</h3><div class="calc-result"><div class="calc-row"><span>Paid meals</span><strong>130</strong></div><div class="calc-row"><span>Average selling price</span><strong>RM 9.62</strong></div><div class="calc-row"><span>Revenue</span><strong>RM 1,250</strong></div><div class="calc-total">Profit: RM 850</div></div></section></div>`;
if(page==='donate-discount')body=`<div class="food-grid">${state.foods.slice(0,3).map(f=>`<article class="food-card"><div class="food-visual">${foodImage(f)}</div><div class="food-body"><h3>${f.name}</h3><div class="muted small">${f.qty} available • ${f.category}</div><div class="price"><strong>${f.type==='Donation'?'FREE':money(f.offer)}</strong><span class="old">${money(f.price)}</span></div><span class="badge ${f.type==='Donation'?'donated':'available'}">${f.type}</span><button class="btn btn-dark" style="width:100%;margin-top:14px" onclick="showDiscount('${f.name}',${f.price},${f.qty})">Manage</button></div></article>`).join('')}</div>`;
if(page==='account')body=`<section class="panel"><div class="form"><div class="form-grid"><div class="field"><label>Restaurant Name</label><input value="The Garden Kitchen"></div><div class="field"><label>Owner Name</label><input value="Demo Owner"></div><div class="field"><label>Email</label><input value="owner@gardenkitchen.my"></div><div class="field"><label>Phone</label><input value="+60 12 345 6789"></div><div class="field"><label>Location</label><input value="Alor Setar, Kedah, Malaysia"></div><div class="field"><label>Category</label><select><option>Malaysian Restaurant</option><option>Mamak</option><option>Cafe</option></select></div></div><button class="btn btn-primary" onclick="toast('Profile saved')">Save Changes</button></div></section><section class="panel" style="margin-top:18px"><h3>Subscription</h3><p class="muted">3-month free trial • then monthly subscription</p><button class="btn btn-dark" onclick="toast('Subscription page opened')">Manage Subscription</button></section>`;
return ownerShell(page,`${demoBanner()}<div class="page-head"><div><h1>${data[2]} ${data[0]}</h1><p>${data[1]}</p></div></div>${body}`)}
function showDiscount(name,price,qty){openModal(`<h2>${name}</h2><p class="muted">Set the offer without doing any math.</p><div class="form"><div class="form-grid"><div class="field"><label>Quantity</label><input id="dq" type="number" value="${qty}"></div><div class="field"><label>Original Price</label><input id="dp" value="${price}" disabled></div></div><div class="field"><label>Choose Action</label><select id="dt" onchange="toggleDiscountModal()"><option>Discount</option><option>Donation</option></select></div><div id="doffer" class="field"><label>Discounted Price (RM)</label><input id="do" type="number" value="${Math.max(1,Math.floor(price*.5))}" oninput="discountModalCalc(${price})"></div><div class="notice" id="dcalc">Automatic calculation: 50% OFF</div><button class="btn btn-primary" onclick="closeModal();toast('Offer updated')">Save Offer</button></div>`)}
function toggleDiscountModal(){const d=document.getElementById('dt').value==='Donation';document.getElementById('doffer').style.display=d?'none':'grid';if(d)document.getElementById('dcalc').textContent='Donation = FREE • 100% value reduction';else discountModalCalc(+document.getElementById('dp').value)}
function discountModalCalc(p){const o=+document.getElementById('do').value||0;document.getElementById('dcalc').textContent='Automatic calculation: '+pct(p,o)+'% OFF • '+money(p-o)+' saved per meal'}
function studentShell(content,active){return `${header()}<div class="shell"><aside class="sidebar"><div class="side-title">Student / Customer<small>Affordable meals in Malaysia</small></div><nav class="nav">${[['dashboard','▦ Dashboard'],['browse','🍴 Food Available'],['near','⌖ Near Me'],['reservations','▤ My Reservations'],['reviews','★ My Reviews'],['profile','◎ Profile']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('student/${x[0]}')">${x[1]}</button>`).join('')}</nav></aside><main class="main">${content}</main></div><nav class="mobile-nav">${[['browse','🍴','Food'],['near','⌖','Near Me'],['reservations','▤','Reservations'],['profile','◎','Profile']].map(x=>`<button onclick="go('student/${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function foodImage(f){return f.image?`<img src="${f.image}" alt="${f.name}" loading="lazy">`:f.emoji}
function foodCards(){return `<div class="food-grid">${state.foods.filter(f=>f.status==='Available').map(f=>`<article class="food-card"><div class="food-visual">${foodImage(f)}</div><div class="food-body"><div class="muted small">The Garden Kitchen • 1.2 km</div><h3>${f.name}</h3><div class="price"><strong>${money(f.offer)}</strong><span class="old">${money(f.price)}</span><span class="off">${pct(f.price,f.offer)}% OFF</span></div><div class="food-meta"><span>${f.qty} left</span><span>⭐ 4.7</span></div><button class="btn btn-dark" style="width:100%" onclick="showFood('${f.name}')">View & Reserve</button></div></article>`).join('')}</div>`}
function showFood(name){const f=state.foods.find(x=>x.name===name);openModal(`<h2>${f.emoji} ${f.name}</h2><p class="muted">The Garden Kitchen • Alor Setar, Kedah</p><div class="price"><strong>${money(f.offer)}</strong><span class="old">${money(f.price)}</span><span class="off">${pct(f.price,f.offer)}% OFF</span></div><div class="notice">Pickup today • Available quantity: ${f.qty} • One student = one meal per distribution period.</div><button class="btn btn-primary" style="width:100%" onclick="reserveFood('${f.name}')">Reserve Meal</button><button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Continue Browsing</button>`)}
function reserveFood(name){if(state.auth!=='student'){openModal(`<h2>Reserve your meal</h2><p class="muted">Create an account or log in to reserve your meal.</p><div class="auth-options"><button class="btn btn-dark" onclick="closeModal();showLogin('student')">Log In</button><button class="btn btn-primary" onclick="closeModal();showSignup('student')">Create Account</button><button class="btn btn-ghost" onclick="closeModal()">Continue Browsing</button></div>`);return}const f=state.foods.find(x=>x.name===name);if(f.qty>0){f.qty--;state.records.unshift(['RES'+Math.floor(1000+Math.random()*8999),name,1,'Reserved']);closeModal();toast('Meal reserved successfully');go('student/reservations')}}
function studentPage(p){if(p==='browse'||p==='dashboard')return studentShell(`<div class="page-head"><div><h1>Good day 👋</h1><p>Affordable meals available now near you.</p></div><button class="btn btn-primary" onclick="go('student/near')">⌖ Near Me</button></div><div class="notice">🇲🇾 Prices shown in RM. Reserve one meal per distribution period and collect it at the restaurant.</div><h3>Food Available Now</h3>${foodCards()}`,p);if(p==='near')return studentShell(`<div class="page-head"><div><h1>Near Me</h1><p>Find discounted and donated food around Alor Setar.</p></div></div><section class="panel" style="margin-bottom:18px"><div class="form-grid"><div class="field"><label>Distance</label><select><option>Within 2 km</option><option>Within 5 km</option><option>Within 10 km</option></select></div><div class="field"><label>Category</label><select><option>All categories</option><option>Rice</option><option>Noodles</option><option>Vegetables</option></select></div></div></section>${foodCards()}`,p);if(p==='reservations')return studentShell(`<div class="page-head"><div><h1>My Reservations</h1><p>Your meal pickup history and active reservations.</p></div></div><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Meal</th><th>Qty</th><th>Status</th><th>Pickup</th></tr></thead><tbody>${state.records.map(r=>`<tr><td>#${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="badge ${r[3]==='Reserved'?'reserved':'available'}">${r[3]}</span></td><td>Today • 6:00 PM</td></tr>`).join('')}</tbody></table></div></section>`,p);if(p==='reviews')return studentShell(`<div class="page-head"><div><h1>My Reviews</h1><p>Share feedback after collecting your meals.</p></div></div><section class="panel"><div class="empty">No reviews yet. Your collected meals will appear here.</div></section>`,p);return studentShell(`<div class="page-head"><div><h1>My Profile</h1><p>Manage your student information.</p></div></div><section class="panel"><div class="form-grid"><div class="field"><label>Full Name</label><input value="Demo Student"></div><div class="field"><label>Student ID</label><input value="AIU2510XXX"></div><div class="field"><label>University / College</label><input value="University in Malaysia"></div><div class="field"><label>Email</label><input value="student@example.com"></div></div><button class="btn btn-primary" onclick="toast('Profile saved')">Save Changes</button></section>`,p)}
function about(){return `${header()}<main class="container"><div class="page-head"><div><h1>About Israf Guard</h1><p>Technology that turns surplus food into affordable meals and measurable impact.</p></div></div><div class="two"><section class="panel"><h3>Our Mission</h3><p class="muted" style="line-height:1.8">Israf Guard is designed for Malaysia: helping restaurants reduce edible food waste while making affordable meals more accessible to students and customers.</p><p class="muted" style="line-height:1.8">Restaurants can list surplus meals, apply discounts or donations, track reservations, and understand the financial and social impact of their food.</p></section><section class="panel"><h3>How It Works</h3><ol class="muted" style="line-height:2"><li>Restaurants list surplus food.</li><li>Israf Guard calculates offers automatically.</li><li>Students discover nearby meals.</li><li>Students reserve and collect.</li><li>Restaurants see records, revenue, and waste reduction.</li></ol></section></div></main>`}
function ownerDemoRoute(){return ownerShell('dashboard',`${demoBanner()}<div class="page-head"><div><h1>Demo Restaurant</h1><p>Explore the full owner experience before creating an account.</p></div></div><div class="notice">This is a fictional demo. Try Production → Add Food to see automatic calculations and data updates.</div><button class="btn btn-primary" onclick="go('owner/production')">Explore Production</button>`) }
function render(){const path=location.hash.replace(/^#/,'')||'home';let html='';if(path==='home')html=landing();else if(path==='student-auth')html=auth('student');else if(path==='owner-auth')html=auth('owner');else if(path==='about')html=about();else if(path==='owner/demo/dashboard')html=ownerDemoRoute();else if(path.startsWith('owner/')){const p=path.split('/')[1];if(p==='signup'){showSignup('owner');html=ownerDemoRoute()}else if(p==='production'){html=production()}else html=p==='dashboard'?ownerDashboard():ownerPages.includes(p)?simpleOwnerPage(p):ownerDashboard()}else if(path.startsWith('student/')){const p=path.split('/')[1];html=studentPage(p)}else html=landing();document.getElementById('app').innerHTML=html;window.scrollTo(0,0)}
window.addEventListener('hashchange',render);window.addEventListener('load',render);window.go=go;window.showLogin=showLogin;window.showSignup=showSignup;window.showAddFood=showAddFood;window.toggleOffer=toggleOffer;window.liveCalc=liveCalc;window.addFood=addFood;window.showDiscount=showDiscount;window.toggleDiscountModal=toggleDiscountModal;window.discountModalCalc=discountModalCalc;window.showFood=showFood;window.reserveFood=reserveFood;window.closeModal=closeModal;
</script>
</body></html>
