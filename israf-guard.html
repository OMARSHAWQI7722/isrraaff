<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Israf Guard — Discover Food. Reduce Waste. Make an Impact.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F2A900;
  --gold-deep:#C9860A;
  --gold-soft:#FFE8B0;
  --navy:#16202E;
  --navy-soft:#2A3A4D;
  --green:#0E9F6E;
  --green-soft:#E4F7EF;
  --red:#DC4C3E;
  --paper:#FBF8F2;
  --card:#FFFFFF;
  --line:#E7E1D4;
  --ink:#1B2430;
  --ink-muted:#6B7280;
  --radius:18px;
  --radius-sm:10px;
  --shadow:0 10px 30px -12px rgba(22,32,46,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'DM Sans', system-ui, sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,.display{
  font-family:'Fraunces', Georgia, serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--navy);
  margin:0;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
img{max-width:100%;display:block;}
#root{max-width:1180px;margin:0 auto;min-height:100vh;position:relative;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;position:sticky;top:0;z-index:40;
  background:rgba(251,248,242,0.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand img{width:34px;height:34px;}
.brand span{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--navy);}
.top-links{display:none;gap:26px;font-size:14.5px;font-weight:500;color:var(--navy-soft);}
.top-links a:hover{color:var(--gold-deep);}
.menu-btn{border:1px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
@media(min-width:860px){
  .top-links{display:flex;}
  .menu-btn{display:none;}
}
.drawer{position:fixed;inset:0;background:rgba(22,32,46,0.55);z-index:60;display:none;}
.drawer.open{display:block;}
.drawer-panel{position:absolute;right:0;top:0;bottom:0;width:78%;max-width:320px;background:var(--paper);padding:26px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);}
.drawer-panel a,.drawer-panel button{padding:14px 6px;font-size:16px;font-weight:600;color:var(--navy);border:none;background:none;text-align:left;border-bottom:1px solid var(--line);cursor:pointer;}

/* ---------- Layout helpers ---------- */
.screen{padding:0 0 100px;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:560px;margin:0 auto;padding:26px 20px;}
.wrap-wide{max-width:1080px;margin:0 auto;padding:26px 20px;}
.back-row{display:flex;align-items:center;gap:10px;padding:16px 20px 0;max-width:560px;margin:0 auto;}
.back-row.wide{max-width:1080px;}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--navy-soft);background:none;border:none;cursor:pointer;padding:8px 0;}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:var(--gold-soft);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;}
.role-chip{display:inline-block;background:var(--gold-soft);color:var(--gold-deep);font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;margin-bottom:14px;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border-radius:13px;font-size:15px;font-weight:700;border:none;cursor:pointer;width:100%;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--gold);color:var(--navy);box-shadow:0 8px 20px -8px rgba(242,169,0,0.55);}
.btn-primary:hover{background:var(--gold-deep);}
.btn-dark{background:var(--navy);color:#fff;}
.btn-dark:hover{background:var(--navy-soft);}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--navy);}
.btn-ghost{background:none;color:var(--navy-soft);font-weight:600;width:auto;padding:8px 0;}
.btn-sm{padding:9px 14px;font-size:13.5px;border-radius:9px;width:auto;}
.btn-danger{background:#FCEBE9;color:var(--red);}

/* ---------- Landing ---------- */
.hero{text-align:center;padding:20px 20px 8px;max-width:640px;margin:0 auto;}
.hero .display{font-size:34px;line-height:1.15;margin-bottom:14px;}
.hero p{color:var(--ink-muted);font-size:15.5px;max-width:440px;margin:0 auto;}
.role-grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:900px;margin:30px auto 0;padding:0 20px;}
@media(min-width:760px){.role-grid{grid-template-columns:repeat(3,1fr);}}
.role-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s ease, border-color .18s ease;}
.role-card:hover{transform:translateY(-3px);border-color:var(--gold);}
.role-icon{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;}
.role-card h3{font-size:19px;margin-bottom:6px;}
.role-card p{color:var(--ink-muted);font-size:14px;margin:0 0 16px;}
.role-card .cta{font-weight:700;font-size:14px;color:var(--gold-deep);display:flex;align-items:center;gap:6px;}

/* ---------- Auth ---------- */
.auth-logo{display:flex;justify-content:center;margin:6px 0 18px;}
.auth-logo img{width:56px;height:56px;}
.auth-head{text-align:center;margin-bottom:26px;}
.auth-head h2{font-size:24px;margin-bottom:8px;}
.auth-head p{color:var(--ink-muted);font-size:14.5px;}
.option-list{display:flex;flex-direction:column;gap:12px;}
.option-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px;cursor:pointer;}
.option-row:hover{border-color:var(--gold);}
.option-row .t{font-weight:700;font-size:15.5px;}
.option-row .s{color:var(--ink-muted);font-size:13px;margin-top:2px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy-soft);margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:#fff;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);}
.field-hint{font-size:12px;color:var(--ink-muted);margin-top:6px;}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink-muted);margin-bottom:18px;}
.checkbox-row input{margin-top:3px;}
.strength{height:5px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden;}
.strength-fill{height:100%;border-radius:99px;transition:width .2s;}
.form-foot{text-align:center;margin-top:18px;font-size:14px;color:var(--ink-muted);}
.form-foot a{color:var(--gold-deep);font-weight:700;}
.error-msg{background:#FCEBE9;color:var(--red);font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none;}
.error-msg.show{display:block;}

/* ---------- Cards / Food ---------- */
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px;}
.section-title h2{font-size:20px;}
.section-title .link{font-size:13.5px;font-weight:700;color:var(--gold-deep);}
.food-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:640px){.food-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:960px){.food-grid{grid-template-columns:repeat(3,1fr);}}
.food-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
.food-img{height:118px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#FFF4DC,#F7EAC7);position:relative;}
.discount-tag{position:absolute;top:10px;left:10px;background:var(--navy);color:var(--gold-soft);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;}
.donation-tag{position:absolute;top:10px;left:10px;background:var(--green);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;}
.food-body{padding:14px 15px 16px;}
.food-body h4{font-size:15.5px;margin:0 0 3px;font-weight:700;color:var(--navy);}
.food-meta{font-size:12.5px;color:var(--ink-muted);display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
.price-old{font-size:13px;color:#9CA3AF;text-decoration:line-through;}
.price-new{font-size:18px;font-weight:800;color:var(--green);}
.price-new.free{color:var(--green);}
.qty-row{font-size:12px;color:var(--ink-muted);margin-bottom:12px;}
.food-card .btn{padding:10px 14px;font-size:13.5px;}

/* ---------- Stats / dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:760px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;}
.stat-card .n{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--navy);}
.stat-card .l{font-size:12.5px;color:var(--ink-muted);margin-top:4px;}
.stat-card .n.gold{color:var(--gold-deep);}
.stat-card .n.green{color:var(--green);}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
.panel h3{font-size:16.5px;margin-bottom:14px;}
.tab-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;-webkit-overflow-scrolling:touch;}
.tab-row::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink-muted);cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--navy);color:var(--gold-soft);border-color:var(--navy);}

table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data-table th{text-align:left;color:var(--ink-muted);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);font-size:12px;text-transform:none;}
table.data-table td{padding:11px 8px;border-bottom:1px solid var(--line);}
.status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;}
.status-Reserved{background:#FFF4DC;color:var(--gold-deep);}
.status-Collected{background:var(--green-soft);color:var(--green);}
.status-Cancelled{background:#FCEBE9;color:var(--red);}
.status-Expired{background:#F1F2F4;color:var(--ink-muted);}
.status-Available{background:var(--green-soft);color:var(--green);}
.status-SoldOut{background:#F1F2F4;color:var(--ink-muted);}

.demo-banner{background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.demo-banner .t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;}
.demo-banner p{color:#B9C3D0;font-size:13px;margin:4px 0 0;}

.chart-card svg{width:100%;height:auto;display:block;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--ink-muted);}
.legend .dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:6px;}

.review-card{border-bottom:1px solid var(--line);padding:14px 0;}
.review-card:last-child{border-bottom:none;}
.stars{color:var(--gold);font-size:14px;letter-spacing:1px;}
.review-name{font-weight:700;font-size:13.5px;color:var(--navy);}
.sample-flag{font-size:11px;color:var(--ink-muted);font-style:italic;margin-top:4px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px 10px;z-index:30;max-width:1180px;margin:0 auto;}
.bottom-nav .item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-muted);background:none;border:none;cursor:pointer;padding:6px 4px;font-weight:600;flex:1;}
.bottom-nav .item .ic{font-size:19px;}
.bottom-nav .item.active{color:var(--gold-deep);}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(22,32,46,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:80;}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:26px 22px 30px;width:100%;max-width:420px;box-shadow:var(--shadow);animation:slideup .25s ease;}
@media(min-width:640px){.modal{border-radius:20px;}}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal h3{font-size:19px;margin-bottom:8px;}
.modal p{color:var(--ink-muted);font-size:14px;margin-bottom:20px;}
.modal .actions{display:flex;flex-direction:column;gap:10px;}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

/* ---------- Misc content ---------- */
.confirm-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 24px;text-align:center;}
.confirm-check{width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;}
.confirm-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left;}
.confirm-row:last-child{border-bottom:none;}
.confirm-row .k{color:var(--ink-muted);}
.confirm-row .v{font-weight:700;color:var(--navy);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-muted);}
.empty-state .ic{font-size:40px;margin-bottom:14px;}

.about-hero{background:var(--navy);color:#fff;padding:60px 20px 50px;text-align:center;}
.about-hero h1{color:#fff;font-size:32px;margin-bottom:12px;}
.about-hero p{color:#B9C3D0;max-width:520px;margin:0 auto;font-size:15px;}
.impact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:640px;margin:34px auto 0;}
@media(min-width:640px){.impact-grid{grid-template-columns:repeat(4,1fr);}}
.impact-item{text-align:center;}
.impact-item .n{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--gold);}
.impact-item .l{font-size:12px;color:#B9C3D0;margin-top:4px;}

.step-list{display:flex;flex-direction:column;gap:14px;}
.step-row{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;}
.step-num{width:32px;height:32px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto;}
.step-row h4{font-size:14.5px;margin-bottom:3px;}
.step-row p{font-size:13px;color:var(--ink-muted);margin:0;}

.footer{border-top:1px solid var(--line);padding:34px 20px;text-align:center;color:var(--ink-muted);font-size:13px;}
.map-box{background:linear-gradient(135deg,#EFEAD9,#E3DCC7);border-radius:var(--radius);height:180px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:13px;margin-bottom:18px;border:1px solid var(--line);position:relative;overflow:hidden;}
.map-pin{position:absolute;font-size:20px;}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
.filter-chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-muted);cursor:pointer;}
.filter-chip.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;}
.search-box input{border:none;outline:none;flex:1;font-size:14.5px;font-family:inherit;}
.list-restaurant{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;cursor:pointer;}
.list-restaurant .ic{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#FFF4DC,#F7EAC7);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;}
.list-restaurant h4{font-size:15px;margin-bottom:3px;}
.list-restaurant .m{font-size:12.5px;color:var(--ink-muted);}
</style>
</head>
<body>
<div id="root"></div>

function updateStrength(v){
  const bar=document.getElementById('strengthBar');
  let score=0;
  if(v.length>=8) score++;
  if(/[0-9]/.test(v)) score++;
  if(/[A-Z]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  const pct=[10,35,65,85,100][score];
  const colors=['#DC4C3E','#DC4C3E','#F2A900','#0E9F6E','#0E9F6E'];
  bar.style.width=pct+'%'; bar.style.background=colors[score];
}

/* Simple inline SVG charts */
function barChart(values,labels){
  const w=560,h=160,pad=24,max=Math.max(...values)*1.15;
  const bw=(w-pad*2)/values.length*0.55;
  const gap=(w-pad*2)/values.length;
  const bars=values.map((v,i)=>{
    const bh=(v/max)*(h-40);
    const x=pad+i*gap+(gap-bw)/2;
    const y=h-30-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="var(--gold)"></rect>
    <text x="${x+bw/2}" y="${h-12}" font-size="11" fill="var(--ink-muted)" text-anchor="middle">${labels[i]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="color:var(--ink)">${bars}</svg>`;
}
function lineChart(series,labels,colors){
  const w=560,h=180,pad=26;
  const allVals=series.flat();
  const max=Math.max(...allVals)*1.1, min=Math.min(...allVals)*0.85;
  const gap=(w-pad*2)/(labels.length-1);
  const paths=series.map((s,si)=>{
    const pts=s.map((v,i)=>{
      const x=pad+i*gap;
      const y=h-30-((v-min)/(max-min))*(h-60);
      return [x,y];
    });
    const d=pts.map((p,i)=>(i===0?'M':'L')+p[0]+' '+p[1]).join(' ');
    const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${colors[si]}"></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${colors[si]}" stroke-width="2.5"></path>${dots}`;
  }).join('');
  const labelsSvg=labels.map((l,i)=>`<text x="${pad+i*gap}" y="${h-8}" font-size="11" fill="var(--ink-muted)" text-anchor="middle">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}">${paths}${labelsSvg}</svg>`;
}
function donutChart(parts){
  const total=parts.reduce((a,b)=>a+b.value,0);
  const cx=90,cy=90,r=70,sw=26;
  let angle=-90;
  const circ=2*Math.PI*r;
  const segs=parts.map(p=>{
    const frac=p.value/total;
    const dash=frac*circ;
    const seg=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-((angle+90)/360)*circ}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    angle+=frac*360;
    return seg;
  }).join('');
  const legend=`<div class="legend">${parts.map(p=>`<span><span class="dot" style="background:${p.color};"></span>${p.label} (${p.value})</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 180 180" style="max-width:200px;margin:0 auto;display:block;">${segs}</svg>${legend}`;
}

/* ============ ACTIONS ============ */
function doReserve(id){
  const f = foodItems.find(x=>x.id===id);
  if(!f || f.qty<=0) return;
  if(!(state.role==='student' && state.mode==='auth')){
    state.modal={type:'guestReserve', id};
    render();
    return;
  }
  const active = state.studentReservations.find(r=>r.status==='Reserved');
  if(active){
    toast('You already have an active reservation. One student = one meal per period.');
    return;
  }
  f.qty -= 1;
  const resId = 'RES'+Math.floor(1000+Math.random()*9000);
  const record = {
    id:resId, food:f.name, restaurant:f.restaurant,
    location:f.locationCity||RESTAURANT.location, pickup:f.pickup,
    date:'Today', status:'Reserved'
  };
  state.studentReservations.unshift(record);
  nav('reserveConfirm',{res:record});
}

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'nav': nav(el.dataset.view); break;
    case 'back': goBack(); break;
    case 'toggleDrawer': state.drawer=!state.drawer; render(); break;
    case 'toast': toast(el.dataset.msg); break;
    case 'selectRole':
      const role = el.dataset.role;
      if(role==='guest'){ state.role='guest'; state.mode='guest'; nav('guestBrowse'); }
      else if(role==='student'){ state.role='student'; nav('studentAuth'); }
      else if(role==='owner'){ state.role='owner'; nav('ownerAuth'); }
      break;
    case 'studentGuest': state.role='student'; state.mode='guest'; nav('guestBrowse'); break;
    case 'ownerGuest': state.role='owner'; state.mode='guest'; nav('ownerDemo'); state.ownerTab='dashboard'; break;
    case 'reserve': doReserve(el.dataset.id); break;
    case 'closeModal': state.modal=null; render(); break;
    case 'goFromModal': state.modal=null; nav(el.dataset.view); break;
    case 'ownerTab': state.ownerTab=el.dataset.tab; render(); break;
    case 'markCollected':
      { const r=ownerReservations.find(x=>x.id===el.dataset.id); if(r) r.status='Collected'; render(); toast('Marked as collected.'); }
      break;
    case 'cancelReservation':
      { const r=state.studentReservations.find(x=>x.id===el.dataset.id);
        if(r){ r.status='Cancelled'; const f=foodItems.find(fx=>fx.name===r.food); if(f) f.qty+=1; }
        render(); toast('Reservation cancelled.'); }
      break;
    case 'rateReservation': toast('Thanks for your rating! (demo)'); break;
    case 'logout':
      state.role=null; state.mode=null; state.studentName=null; state.studentReservations=[];
      nav('landing',{},false); state.history=[];
      break;
    case 'finishSetup': toast('Restaurant setup complete! (demo)'); nav('ownerDemo'); state.ownerTab='dashboard'; break;
    case 'submit': break; // handled by submit listener
  }
});

document.addEventListener('submit',(e)=>{
  const form = e.target.closest('[data-action="submit"]');
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if(kind==='studentLogin'){
    const email = document.getElementById('li-email').value.trim();
    if(!email){ return; }
    state.role='student'; state.mode='auth';
    state.studentName = email.split('@')[0].replace(/[^a-zA-Z]/g,' ').trim() || 'Student';
    state.studentName = state.studentName.charAt(0).toUpperCase()+state.studentName.slice(1);
    nav('studentDashboard',{},false); state.history=[];
  } else if(kind==='studentSignup'){
    const name = document.getElementById('su-name').value.trim();
    const pass = document.getElementById('su-pass').value;
    const pass2 = document.getElementById('su-pass2').value;
    const terms = document.getElementById('su-terms').checked;
    const err = document.getElementById('signupError');
    if(pass!==pass2){ err.textContent='Passwords do not match.'; err.classList.add('show'); return; }
    if(!terms){ err.textContent='Please accept the Terms & Conditions.'; err.classList.add('show'); return; }
    err.classList.remove('show');
    state.role='student'; state.mode='auth'; state.studentName = name || 'Student';
    nav('studentDashboard',{},false); state.history=[];
  } else if(kind==='ownerLogin' || kind==='ownerSignup'){
    nav(kind==='ownerLogin' ? 'ownerDemo' : 'ownerSetup',{},false);
    if(kind==='ownerLogin'){ state.ownerTab='dashboard'; }
    state.history=[];
  } else if(kind==='contact'){
    toast("Message sent — we'll be in touch soon!");
    form.reset();
  }
});

render();
</script>
</body>
</html>
